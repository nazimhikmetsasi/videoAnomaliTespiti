# Altyapi servisleri. GPU gerektiren vision/ servisi host'ta native venv'de
# calisir ve Kafka'ya localhost:9092 uzerinden baglanir (bkz. docs/PLAN.md 2).
#
# spark  -> Asama 4'te eklenecek (stream/spark_job.py henuz yok)
# api    -> Asama 5'te eklenecek (api/ henuz yok)

services:
  postgres:
    image: postgres:16-alpine
    container_name: anomaly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:7
    container_name: anomaly-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/10-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka:
    # KRaft modu: Zookeeper yok. Tek broker, tek container.
    image: apache/kafka:3.9.0
    container_name: anomaly-kafka
    restart: unless-stopped
    ports:
      # 9092 host icin (vision/ native calisiyor), 29092 docker agi icin
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Topic'leri olusturur ve cikar. Kalici servis degil.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: anomaly-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    volumes:
      - ./infra/kafka/topics.sh:/topics.sh:ro
    restart: "no"

volumes:
  postgres_data:
  mongo_data:
  # ponytail: Kafka log'u kalici degil. Olaylar zaten PostgreSQL/MongoDB'ye
  # yaziliyor; restart'ta kaybolan sey yalnizca consumer offset'i.
  # Kalici gerekirse: KAFKA_LOG_DIRS + named volume + uid 1000 sahiplik ayari.
