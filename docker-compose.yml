# Altyapi servisleri. GPU gerektiren vision/ servisi host'ta native venv'de
# calisir ve Kafka'ya localhost:9092 uzerinden baglanir (bkz. docs/PLAN.md 2).

services:
  postgres:
    image: postgres:16-alpine
    container_name: anomaly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:7
    container_name: anomaly-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/10-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka:
    # KRaft modu: Zookeeper yok. Tek broker, tek container.
    image: apache/kafka:3.9.0
    container_name: anomaly-kafka
    restart: unless-stopped
    ports:
      # 9092 host icin (vision/ native calisiyor), 29092 docker agi icin
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Topic'leri olusturur ve cikar. Kalici servis degil.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: anomaly-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    volumes:
      - ./infra/kafka/topics.sh:/topics.sh:ro
    restart: "no"

  spark:
    image: apache/spark:3.5.4-scala2.12-java17-python3-ubuntu
    container_name: anomaly-spark
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      # SS9: esikler acilista GET /api/settings'ten cekilir; api ayakta
      # degilse istek hata alir ve ortam varsayilanlarina dusulur.
      api:
        condition: service_healthy
    # ponytail: root olarak calisiyor. apache/spark imaji uid 185'tir, adlandirilmis
    # volume'lar root'a aittir; yerel gelistirmede sahiplik ayari yerine root ucuz.
    # Uretimde: volume'lari 185:185 yap, user satirini kaldir.
    user: root
    entrypoint: ["/opt/spark/bin/spark-submit"]
    command:
      - "--master"
      - "local[2]"
      - "--packages"
      - "org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.4"
      - "--conf"
      - "spark.jars.ivy=/ivy"
      - "/app/spark_job.py"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      CHECKPOINT_DIR: /checkpoints
      # ASAMA6_PLAN.md SS9: esikler acilista API'den cekilir. GET /api/settings
      # kimlik ister; SPARK_SETTINGS_TOKEN .env'de bos birakilirsa istek 401
      # alir, spark_job.py tek satir uyari basip ortam varsayilanlarinda kalir.
      # Degerler DAG'e acilista gomulur -- panelden degistirilen spark_window_sec
      # ancak Spark yeniden baslayinca gecerli olur (bilincli sinir, SS9).
      SETTINGS_API_URL: http://api:8000
      SETTINGS_API_TOKEN: ${SPARK_SETTINGS_TOKEN:-}
    volumes:
      - ./stream:/app:ro
      - spark_checkpoints:/checkpoints
      - spark_ivy:/ivy

  api:
    build: ./api
    container_name: anomaly-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/
      MONGO_DB: ${MONGO_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      KAFKA_BOOTSTRAP: kafka:29092
      STORAGE_DIR: /storage
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Kanit dosyalarini vision/ (host) yazar, api yalnizca sunar -- salt okunur
      # (docs/ASAMA6_PLAN.md SS5.3).
      - ./storage:/storage:ro
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # anomaly-events -> PostgreSQL + MongoDB (ASAMA5_PLAN.md SS6). Kalici
  # servis degil ayni imaji api ile paylasir, yalnizca komutu farklidir.
  consumer:
    build: ./api
    container_name: anomaly-consumer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/
      MONGO_DB: ${MONGO_DB}
      KAFKA_BOOTSTRAP: kafka:29092
      # stdout TTY degilken Python arabellege alir; arabellek olmadan `docker
      # compose logs` sayac ozetini/uyarilari gecikmeden gosterir.
      PYTHONUNBUFFERED: "1"
      # Asama 7: bildirim (api/llm.py, api/notify.py) burada, consumer icinde
      # calisir (ASAMA7_PLAN.md SS1/7). api servisine eklenmez -- api bu iki
      # servisi cagirmiyor.
      STORAGE_DIR: /storage
      # Rapor metnindeki saat operatorun yerel saatidir; container UTC
      # dogar ve saat 3 saat geri gorunurdu (Asama 7 olcum 1).
      TZ: ${TZ:-Europe/Istanbul}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      # Kanit karesi Telegram'a yuklenir -- salt okunur (api ile ayni gerekce).
      - ./storage:/storage:ro
    command: python -m api.workers.consumer

volumes:
  postgres_data:
  mongo_data:
  # ponytail: Kafka log'u kalici degil. Olaylar zaten PostgreSQL/MongoDB'ye
  # yaziliyor; restart'ta kaybolan sey yalnizca consumer offset'i.
  # Kalici gerekirse: KAFKA_LOG_DIRS + named volume + uid 1000 sahiplik ayari.
  spark_checkpoints:
  spark_ivy:   # ilk indirmeden sonra --packages'i cevrimdisi baslatir
